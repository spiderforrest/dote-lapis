worker_processes ${{NUM_WORKERS}};
error_log stderr notice;
daemon off;
pid logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  init_by_lua_block {
    require "lpeg"
  }

  # data caching
  lua_shared_dict page_cache 512m;
  # put these all in one spot (that isn't the root dir, because i'm petty)
  fastcgi_temp_path .temp/fastcgi 1 2;
  proxy_temp_path .temp/proxy 1 2;
  scgi_temp_path .temp/scgi 1 2;
  uwsgi_temp_path .temp/uwsgi 1 2;
  client_body_temp_path .temp/client_body 1 2;


  server {
    listen ${{PORT}};

    # in config.lua there's a block with the https configuraton and `listen` statement,
    # which is expanded like eval here. this is because a testing env should not have certs
    # so no serving https, and nginx doesn't allow `listen` inside if statements
    ${{SSL_EVAL}}

    lua_code_cache ${{CODE_CACHE}};


    location / {
      default_type text/html;
      content_by_lua_block {
          require"lapis".serve"init"
      }
    }

    location /static/ {
      alias client/static/;
    }

    location /favicon.ico {
      alias client/static/favicon.ico;
    }

    location /robots.txt {
      alias client/static/favicon.ico;
    }

    # haaaaad to do it to em, shoulda listened the first time
    # if ($http_user_agent ~* "(Amazonbot|anthropic-ai|Applebot-Extended|Bytespider|CCBot|ChatGPT-User|ClaudeBot|Claude-Web|cohere-ai|Diffbot|FacebookBot|FriendlyCrawler|Google-Extended|GoogleOther|GoogleOther-Image|GoogleOther-Video|GPTBot|ImagesiftBot|img2dataset|omgili|omgilibot|PerplexityBot|YouBot)") {
    #   return 307 https://ash-speed.hetzner.com/1GB.bin;
    # }
  }
}
